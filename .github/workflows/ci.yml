# CI for mouse-mesh-pipeline (GitHub Actions; also runs on Gitea via act_runner).
#
# python          lint + format check + byte-compile
# docs            build Doxygen HTML (artifact)
# cpp-linux       build the Linux CGAL binaries (+ upload)         -> linux64-binaries
# cpp-windows     build the Windows CGAL binaries (+ DLLs)         -> win64-binaries
# cpp-macos       build the macOS CGAL binaries (+ bundled dylibs) -> macos-binaries
# installer       Windows setup.exe (PyInstaller)                  -> mouse-mesh-pipeline-setup
# linux-packages  .deb + .rpm + Arch .pkg.tar.zst (nfpm)           -> linux-packages
# appimage        self-contained .AppImage                         -> appimage
# macos-installer .pkg installer (pkgbuild)                        -> macos-pkg
# pages           deploy the Doxygen HTML to GitHub Pages (GitHub only, default branch)
# release         on a v* tag: publish a Release with every installer + source + README

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Lint, format & compile (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip ruff black clang-format
      - name: Lint (real errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Format check (black)
        run: black --check --diff .
      - name: Format check (clang-format)
        run: clang-format --dry-run --Werror cgal_remesh/*.cpp
      - name: Byte-compile every module
        run: python -m py_compile $(git ls-files '*.py')

  docs:
    name: Doxygen documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Doxygen + Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build docs
        run: doxygen Doxyfile
      - name: Upload HTML docs
        # Best-effort: Gitea's act_runner artifact backend can reject
        # upload-artifact@v4, and that must not fail the (successful) doc build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/html

  cpp-linux:
    name: Build C++ (Linux, CGAL 6.0.1 + TBB)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain + CGAL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgmp-dev libmpfr-dev libboost-dev \
                                  libeigen3-dev libtbb-dev wget xz-utils
      - name: Fetch CGAL 6.0.1 headers
        run: |
          wget -q https://github.com/CGAL/cgal/releases/download/v6.0.1/CGAL-6.0.1-library.tar.xz
          tar xf CGAL-6.0.1-library.tar.xz
      - name: Build (parallel Mesh_3 via TBB)
        run: |
          cd cgal_remesh
          CGAL=../CGAL-6.0.1/include
          g++ -O2 -std=c++17 -DCGAL_LINKED_WITH_TBB -I"$CGAL" mesh_and_remesh.cpp \
              -lgmp -lmpfr -ltbb -ltbbmalloc -o mesh_and_remesh
          g++ -O2 -std=c++17 -I"$CGAL" tet_remesh.cpp -lgmp -lmpfr -o tet_remesh
      - name: Collect binaries
        run: |
          mkdir -p out
          cp cgal_remesh/mesh_and_remesh cgal_remesh/tet_remesh out/
          ./out/mesh_and_remesh || true   # smoke: prints usage
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux64-binaries
          path: out

  cpp-windows:
    name: Build C++ (Windows, CGAL 6.0.1 + TBB)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-eigen3
            mingw-w64-ucrt-x86_64-tbb
            curl tar
      - name: Fetch CGAL 6.0.1 headers
        run: |
          curl -L -o cgal.tar.xz https://github.com/CGAL/cgal/releases/download/v6.0.1/CGAL-6.0.1-library.tar.xz
          tar xf cgal.tar.xz
      - name: Build mesh_and_remesh (TBB) + tet_remesh
        run: |
          cd cgal_remesh
          CGAL=../CGAL-6.0.1/include
          g++ -O2 -std=c++17 -DCGAL_LINKED_WITH_TBB -I"$CGAL" mesh_and_remesh.cpp \
              -lmpfr -lgmp -ltbb12 -ltbbmalloc -o mesh_and_remesh.exe
          g++ -O2 -std=c++17 -I"$CGAL" tet_remesh.cpp -lmpfr -lgmp -o tet_remesh.exe
      - name: Collect exe + runtime DLLs
        run: |
          mkdir -p out
          cp cgal_remesh/mesh_and_remesh.exe cgal_remesh/tet_remesh.exe out/
          for d in libgcc_s_seh-1 libgmp-10 libmpfr-6 libstdc++-6 libwinpthread-1 libtbb12 libtbbmalloc; do
            cp /ucrt64/bin/$d.dll out/
          done
          ./out/mesh_and_remesh.exe || true   # smoke: loads its DLLs, prints usage
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: win64-binaries
          path: out

  cpp-macos:
    name: Build C++ (macOS, CGAL + TBB)
    # macOS runners are GitHub-only; skip on Gitea act_runner.
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install CGAL toolchain (Homebrew)
        run: brew install cgal tbb dylibbundler
      - name: Build + bundle dylibs
        run: |
          cd cgal_remesh
          BREW=$(brew --prefix)
          CGAL=$(brew --prefix cgal)
          clang++ -O2 -std=c++17 -DCGAL_LINKED_WITH_TBB \
              -I"$CGAL/include" -I"$BREW/include" mesh_and_remesh.cpp \
              -L"$BREW/lib" -lgmp -lmpfr -ltbb -ltbbmalloc -o mesh_and_remesh
          clang++ -O2 -std=c++17 -I"$CGAL/include" -I"$BREW/include" \
              tet_remesh.cpp -L"$BREW/lib" -lgmp -lmpfr -o tet_remesh
          mkdir -p ../out
          cp mesh_and_remesh tet_remesh ../out/
          # copy the non-system dylibs next to the binaries and rewrite the load
          # paths to @executable_path/libs (so it runs without Homebrew present)
          dylibbundler -cd -of -b -x ../out/mesh_and_remesh -d ../out/libs \
              -p @executable_path/libs -s "$BREW/lib"
          dylibbundler -cd -of -b -x ../out/tet_remesh -d ../out/libs \
              -p @executable_path/libs -s "$BREW/lib"
          ../out/mesh_and_remesh || true   # smoke: prints usage
      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: out

  installer:
    name: Windows installer (PyInstaller)
    needs: cpp-windows
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Get CI-built C++ binaries
        uses: actions/download-artifact@v4
        with:
          name: win64-binaries
          path: bin/win64
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File installer/build.ps1
      - name: Upload installer exe
        uses: actions/upload-artifact@v4
        with:
          name: mouse-mesh-pipeline-setup
          path: installer/dist/mouse-mesh-pipeline-setup.exe

  linux-packages:
    name: Linux packages (deb/rpm/Arch)
    needs: cpp-linux
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Get Linux C++ binaries
        uses: actions/download-artifact@v4
        with:
          name: linux64-binaries
          path: bin/linux64
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
      - name: Assemble payload + build packages
        run: |
          chmod +x bin/linux64/*
          mkdir -p payload/installer payload/bin/linux64
          cp ./*.py payload/
          cp -r cgal_remesh configs scripts payload/
          cp README.md LICENSE payload/
          cp installer/setup_env.py payload/installer/
          cp installer/requirements.txt payload/requirements.txt
          cp bin/linux64/mesh_and_remesh bin/linux64/tet_remesh payload/bin/linux64/
          chmod +x payload/bin/linux64/*
          rm -f payload/cgal_remesh/*.exe
          V="${GITHUB_REF_NAME}"; case "$V" in v*) V="${V#v}";; *) V="0.0.0";; esac
          export VERSION="$V"
          mkdir -p dist
          nfpm pkg -f installer/linux/nfpm.yaml -p deb \
            -t "dist/mouse-mesh-pipeline_${VERSION}_amd64.deb"
          nfpm pkg -f installer/linux/nfpm.yaml -p rpm \
            -t "dist/mouse-mesh-pipeline-${VERSION}-1.x86_64.rpm"
          nfpm pkg -f installer/linux/nfpm.yaml -p archlinux \
            -t "dist/mouse-mesh-pipeline-${VERSION}-1-x86_64.pkg.tar.zst"
          ls -l dist/
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  appimage:
    name: AppImage (self-contained)
    needs: cpp-linux
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Get Linux C++ binaries
        uses: actions/download-artifact@v4
        with:
          name: linux64-binaries
          path: bin/linux64
      - name: Build AppImage
        run: |
          chmod +x bin/linux64/* installer/appimage/build.sh
          V="${GITHUB_REF_NAME}"; case "$V" in v*) V="${V#v}";; *) V="0.0.0";; esac
          VERSION="$V" bash installer/appimage/build.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  macos-installer:
    name: macOS installer (.pkg)
    needs: cpp-macos
    if: >-
      github.server_url == 'https://github.com' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Get macOS C++ binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: bin/macos
      - name: Build pkg
        run: |
          chmod +x bin/macos/mesh_and_remesh bin/macos/tet_remesh \
                   installer/macos/build-pkg.sh installer/macos/postinstall \
                   installer/macos/mouse-mesh-pipeline
          V="${GITHUB_REF_NAME}"; case "$V" in v*) V="${V#v}";; *) V="0.0.0";; esac
          VERSION="$V" bash installer/macos/build-pkg.sh
      - name: Upload macOS pkg
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg

  pages:
    name: Deploy docs to Pages
    needs: docs
    if: >-
      github.server_url == 'https://github.com' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Doxygen + Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build docs
        run: doxygen Doxyfile
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # On a v* tag (GitHub only): publish a Release with every installer, a source
  # archive and the README as downloadable assets.
  release:
    name: Release (assets)
    needs: [installer, linux-packages, appimage, macos-installer]
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp artifacts/mouse-mesh-pipeline-setup/*.exe dist/ 2>/dev/null || true
          cp artifacts/linux-packages/* dist/ 2>/dev/null || true
          cp artifacts/appimage/*.AppImage dist/ 2>/dev/null || true
          cp artifacts/macos-pkg/*.pkg dist/ 2>/dev/null || true
          git archive --format=zip -o dist/mouse-mesh-pipeline-src.zip HEAD
          cp README.md dist/README.md
          ls -l dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
